name: Feature request
description: An idea to make Gravitone better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation and what is missing, rather than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: mac
    attributes:
      label: How does macOS do it (if it does)?
