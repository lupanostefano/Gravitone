version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      vortice:
        patterns: ['Vortice.*']
      tests:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk', 'coverlet.*']
    # one entry for the whole repository: it also finds tests/Gravitone.Tests
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
