name: MSIX (Store package)

# Builds both packages: the test one (to try on a PC, signed with a test certificate) and the one to upload to
# Partner Center (the identity of the reserved product, unsigned: the Store signs it).
on:
  # Runs on its own for pushes to the branch where the package is being tried (a manual run needs the file on main).
  push:
    branches: ['claude/trusting-wright-hftepj']
    paths: ['.github/workflows/msix.yml', 'tools/build-msix.ps1', 'packaging/msix/**', 'Core/**', 'UI/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version'
        required: true
        default: '0.2.1'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build the packages
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || '0.2.1' }}
        run: |
          ./tools/build-msix.ps1 -Version $env:VERSION -Sign
          ./tools/build-msix.ps1 -Version $env:VERSION -Store

      - name: Test package (sideload)
        uses: actions/upload-artifact@v7
        with:
          name: gravitone-msix-test
          path: |
            dist/*-test.msix
            dist/Gravitone-test.cer

      - name: Store package (upload to Partner Center)
        uses: actions/upload-artifact@v7
        with:
          name: gravitone-msix-store
          path: dist/*-store.msix
