name: MSIX (Store package)

# Builds the Microsoft Store package by hand: a test package to try on a PC, or the one to upload to Partner Center.
on:
  # Runs on its own for pushes to the branch where the package is being tried (a manual run needs the file on main).
  push:
    branches: ['claude/trusting-wright-hftepj']
    paths: ['.github/workflows/msix.yml', 'tools/build-msix.ps1', 'packaging/msix/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version'
        required: true
        default: '0.2.1'
      store:
        description: 'Package for the Store (identity of the reserved product, unsigned). Off: a test package, signed with a test certificate.'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build the package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || '0.2.1' }}
          STORE: ${{ inputs.store }}
        run: |
          $params = @{ Version = $env:VERSION }
          if ($env:STORE -eq 'true') { $params.Store = $true } else { $params.Sign = $true }
          ./tools/build-msix.ps1 @params

      - uses: actions/upload-artifact@v7
        with:
          name: gravitone-msix
          path: dist/*
