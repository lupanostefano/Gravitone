<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gravitone support banner</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* 1280x320, shown in the README and on the site under "Support". */
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 320px; overflow: hidden; background: transparent; }
  .card { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; color: #f6f4ff;
    font-family: "Bricolage Grotesque", "Segoe UI Variable Display", sans-serif;
    background:
      radial-gradient(600px 380px at 8% 0%, rgba(123, 108, 255, .6), transparent 70%),
      radial-gradient(520px 360px at 100% 100%, rgba(255, 95, 168, .5), transparent 70%),
      linear-gradient(120deg, #1d1650, #0d0a2c 60%, #1a0f33); }
  .card::after { content: ""; position: absolute; inset: 0; border-radius: 28px; border: 1.5px solid rgba(255, 255, 255, .14); }
  svg.orbits { position: absolute; inset: 0; }
  .icon { position: absolute; left: 64px; top: 50%; width: 176px; height: 176px; transform: translateY(-50%);
    filter: drop-shadow(0 20px 30px rgba(5, 3, 26, .55)); }
  .copy { position: absolute; left: 290px; top: 64px; right: 420px; }
  .eyebrow { font: 500 15px "Geist Mono", monospace; letter-spacing: .16em; text-transform: uppercase; color: rgba(246, 244, 255, .55); }
  h2 { font-weight: 800; font-size: 54px; line-height: 1; letter-spacing: -.035em; margin-top: 16px; }
  h2 b { background: linear-gradient(100deg, #fff, #ff8fc4 75%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { font-weight: 600; font-size: 22px; line-height: 1.3; color: rgba(246, 244, 255, .7); margin-top: 16px; }
  .cta { position: absolute; right: 64px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 16px;
    padding: 22px 34px; border-radius: 20px; font-weight: 800; font-size: 28px; letter-spacing: -.01em;
    background: linear-gradient(100deg, #ff5f7a, #ff8fc4); color: #2a0b22; box-shadow: 0 16px 40px -10px rgba(255, 95, 150, .7); }
  .cta svg { width: 44px; height: 44px; }
</style>
</head>
<body>
  <div class="card">
    <svg class="orbits" viewBox="0 0 1280 320" aria-hidden="true">
      <defs><linearGradient id="o" x1="0" x2="1"><stop offset="0" stop-color="#3cc8f0" stop-opacity="0"/><stop offset=".5" stop-color="#b9a8ff" stop-opacity=".4"/><stop offset="1" stop-color="#ff8fc4" stop-opacity="0"/></linearGradient></defs>
      <ellipse cx="152" cy="160" rx="420" ry="120" fill="none" stroke="url(#o)" stroke-width="2" transform="rotate(-12 152 160)"/>
      <ellipse cx="152" cy="160" rx="620" ry="190" fill="none" stroke="url(#o)" stroke-width="1.5" opacity=".6" transform="rotate(-12 152 160)"/>
    </svg>
    <img class="icon" src="icon.svg" alt="">
    <div class="copy">
      <div class="eyebrow">Free · open source · no ads</div>
      <h2>Enjoying <b>Gravitone?</b></h2>
      <p>It is made in spare time. A coffee keeps the updates coming.</p>
    </div>
    <div class="cta">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#2a0b22" d="M8 14h26v12a10 10 0 0 1-10 10h-6A10 10 0 0 1 8 26z"/><path fill="none" stroke="#2a0b22" stroke-width="4" d="M34 17h3a6 6 0 0 1 0 12h-3"/><path fill="#ff8fc4" d="M21 31s-7-4.2-7-9a3.8 3.8 0 0 1 7-2 3.8 3.8 0 0 1 7 2c0 4.8-7 9-7 9z"/><path fill="none" stroke="#2a0b22" stroke-width="3" stroke-linecap="round" d="M15 6c-2 2 2 3 0 5M21 5c-2 2 2 3 0 5M27 6c-2 2 2 3 0 5"/></svg>
      Buy me a coffee
    </div>
  </div>
</body>
</html>
