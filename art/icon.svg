<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Gravitone app icon. Original artwork (MIT, see LICENSE).
       A body with its own gravity: a glowing core, an orbit tilted around it, one satellite caught in it. -->
  <defs>
    <!-- tile: deep space, lit from the top left -->
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2a1d63"/>
      <stop offset="0.55" stop-color="#140f3a"/>
      <stop offset="1" stop-color="#090722"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#7b6cff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7b6cff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#ff5fa8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5fa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <!-- core -->
    <radialGradient id="core" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#fff4fb"/>
      <stop offset="0.18" stop-color="#ffc2e0"/>
      <stop offset="0.5" stop-color="#ff6fb4"/>
      <stop offset="0.82" stop-color="#8a4dff"/>
      <stop offset="1" stop-color="#3a1f9e"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#ff7ab9" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#9b6bff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <!-- orbit -->
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3cc8f0"/>
      <stop offset="0.5" stop-color="#b9a8ff"/>
      <stop offset="1" stop-color="#ff8fc4"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#9eecff"/>
      <stop offset="1" stop-color="#2a9fd6"/>
    </radialGradient>
    <clipPath id="front"><rect x="0" y="512" width="1024" height="512"/></clipPath>
    <clipPath id="back"><rect x="0" y="0" width="1024" height="512"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05031a" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- tile (macOS-style squircle, 824 on a 1024 grid) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#nebula)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#nebula2)"/>
  <!-- a few distant stars -->
  <g fill="#ffffff">
    <circle cx="238" cy="262" r="5" opacity="0.8"/>
    <circle cx="780" cy="224" r="4" opacity="0.6"/>
    <circle cx="820" cy="420" r="3" opacity="0.5"/>
    <circle cx="214" cy="640" r="3.5" opacity="0.45"/>
    <circle cx="700" cy="812" r="3" opacity="0.4"/>
  </g>

  <g transform="rotate(-18 512 512)">
    <!-- far half of the orbit, behind the core -->
    <g clip-path="url(#back)">
      <ellipse cx="512" cy="512" rx="318" ry="104" fill="none" stroke="url(#orbit)" stroke-width="22" opacity="0.45"/>
    </g>
  </g>

  <!-- core with its glow -->
  <circle cx="512" cy="512" r="250" fill="url(#halo)" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="176" fill="url(#core)"/>
  <!-- specular and terminator -->
  <ellipse cx="452" cy="438" rx="74" ry="48" fill="#ffffff" opacity="0.38" transform="rotate(-28 452 438)"/>
  <circle cx="512" cy="512" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <g transform="rotate(-18 512 512)">
    <!-- near half of the orbit, in front of the core -->
    <g clip-path="url(#front)">
      <ellipse cx="512" cy="512" rx="318" ry="104" fill="none" stroke="url(#orbit)" stroke-width="30" filter="url(#glow)" opacity="0.55"/>
      <ellipse cx="512" cy="512" rx="318" ry="104" fill="none" stroke="url(#orbit)" stroke-width="22"/>
    </g>
    <!-- the satellite, caught on the near side -->
    <circle cx="742" cy="584" r="40" fill="#3cc8f0" opacity="0.45" filter="url(#glow)"/>
    <circle cx="742" cy="584" r="30" fill="url(#moon)"/>
  </g>

  <!-- glass rim -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
