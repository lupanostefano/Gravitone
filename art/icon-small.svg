<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Gravitone icon for 16-32 px: the same drawing with the tile filling the square, bolder strokes, no stars. -->
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#34237a"/>
      <stop offset="1" stop-color="#0d0a2c"/>
    </linearGradient>
    <radialGradient id="core" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#fff4fb"/>
      <stop offset="0.25" stop-color="#ffb3d6"/>
      <stop offset="0.6" stop-color="#ff5fa8"/>
      <stop offset="1" stop-color="#6a3bea"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3cc8f0"/>
      <stop offset="1" stop-color="#ff8fc4"/>
    </linearGradient>
    <clipPath id="front"><rect x="0" y="512" width="1024" height="512"/></clipPath>
    <clipPath id="back"><rect x="0" y="0" width="1024" height="512"/></clipPath>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#tile)"/>
  <g transform="rotate(-18 512 512)">
    <g clip-path="url(#back)"><ellipse cx="512" cy="512" rx="400" ry="140" fill="none" stroke="url(#orbit)" stroke-width="58" opacity="0.55"/></g>
  </g>
  <circle cx="512" cy="512" r="236" fill="url(#core)"/>
  <g transform="rotate(-18 512 512)">
    <g clip-path="url(#front)"><ellipse cx="512" cy="512" rx="400" ry="140" fill="none" stroke="url(#orbit)" stroke-width="58"/></g>
    <circle cx="800" cy="604" r="62" fill="#bff3ff"/>
  </g>
</svg>
